# Shared-contracts drift gate. `@devdigest/shared` is vendored twice
# (server/src/vendor/shared = canonical, client/src/vendor/shared = copy); the
# two must be identical. Runs on any change to either copy — the per-package
# workflows can't catch this, since each one's path filter sees only one side.
# No install step: the check script is dependency-free.
name: shared sync

on:
  push:
    branches: [main]
    paths:
      - 'server/src/vendor/shared/**'
      - 'client/src/vendor/shared/**'
      - 'scripts/check-shared-sync.mjs'
      - '.github/workflows/shared-sync.yml'
  pull_request:
    paths:
      - 'server/src/vendor/shared/**'
      - 'client/src/vendor/shared/**'
      - 'scripts/check-shared-sync.mjs'
      - '.github/workflows/shared-sync.yml'

permissions:
  contents: read

jobs:
  check:
    name: vendored copies identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/check-shared-sync.mjs
