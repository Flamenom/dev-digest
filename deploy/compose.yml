# DevDigest — single-VM server-mode deployment (AC-60, AC-61, AC-65, AC-66).
#
#   cp deploy/.env.example deploy/.env      # then fill in real values
#   docker compose -f deploy/compose.yml up -d --build
#
# Topology:
#   internet ─▶ proxy (Caddy, 80/443, the ONLY published service)
#                 ├─ /api/*  ─▶ api:3001   (prefix stripped)
#                 └─ /*      ─▶ web:3000
#   api / migrate ─▶ postgres:5432 on the `db` network (internal: no egress, no host port)
#
# Order: postgres healthy → migrate (db:migrate && db:bootstrap) exits 0 → api
# healthy (/health/ready) → proxy. The API itself never runs migrations.
#
# This file is separate from the root docker-compose.yml (local dev Postgres) and
# uses its own project name so volumes never collide with the dev database.

name: devdigest-server

x-hardening: &hardening
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Shared by `api` and `migrate` (bootstrap loads the same validated config).
x-api-env: &api-env
  NODE_ENV: production
  AUTH_MODE: google
  API_PORT: "3001"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://devdigest:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/devdigest
  DEVDIGEST_CLONE_DIR: /data/clones
  PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in deploy/.env}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in deploy/.env}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in deploy/.env}
  AUTH_ALLOWED_DOMAIN: ${AUTH_ALLOWED_DOMAIN:?set AUTH_ALLOWED_DOMAIN in deploy/.env}
  AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
  SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY in deploy/.env}
  SECRETS_MASTER_KEY_PREVIOUS: ${SECRETS_MASTER_KEY_PREVIOUS:-}
  EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
  REPO_INTEL_ENABLED: ${REPO_INTEL_ENABLED:-true}
  # Forwarded client IP/scheme are trusted ONLY from the proxy's static IP below.
  TRUST_PROXY: 172.28.0.10

services:
  proxy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.28.0.10
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    <<: *hardening
    image: devdigest-web:local
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    <<: *hardening
    image: devdigest-api:local
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment: *api-env
    volumes:
      - clones:/data/clones
    networks:
      edge: {}
      db: {}
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    <<: *hardening
    image: devdigest-api:local
    restart: "no"
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:bootstrap"]
    environment: *api-env
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_DB: devdigest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # Proxy ↔ web ↔ api. Not internal: Caddy needs ACME egress, the API needs
  # GitHub/GitLab/LLM/Google egress. Fixed subnet so the proxy IP is stable.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # api/migrate ↔ postgres only. No egress, Postgres never on `edge`.
  db:
    internal: true

volumes:
  pgdata:
  clones:
  caddy_data:
  caddy_config:
